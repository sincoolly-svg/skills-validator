name: Skills Validator
description: Run static safety checks against an AI agent skill directory.
inputs:
  target:
    description: Local directory to scan.
    required: false
    default: .
  format:
    description: Report format: text, markdown, or json.
    required: false
    default: markdown
runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24
    - name: Install scanner dependencies
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm install --ignore-scripts --no-audit --no-fund
    - name: Build scanner
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm run build
    - name: Scan skill
      shell: bash
      run: node "${{ github.action_path }}/dist/index.js" scan "${{ inputs.target }}" --format "${{ inputs.format }}"
